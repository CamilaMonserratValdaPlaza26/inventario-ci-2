name: CD - Build, Push and Deploy

on:
  push:
    branches: [main, staging]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v6

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y Push de la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/inventario-api:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/inventario-api:${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}

      - name: Escaneo de vulnerabilidades
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/inventario-api:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Desplegar en produccion
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/inventario-api:latest"
            CONTAINER="${{ vars.CONTAINER_NAME }}"
            PORT="${{ vars.DEPLOY_PORT }}"
            TEMP_CONTAINER="${CONTAINER}-new"
            TEMP_PORT=$((PORT + 1))

            docker pull $IMAGE
            docker run -d \
              --name $TEMP_CONTAINER \
              --restart unless-stopped \
              -p $TEMP_PORT:3000 \
              $IMAGE

            sleep 5

            if curl -sf http://localhost:$TEMP_PORT/health; then
              echo "Health check exitoso. Activando nuevo contenedor..."
              docker stop $CONTAINER || true
              docker rm $CONTAINER || true
              docker run -d \
                --name $CONTAINER \
                --restart unless-stopped \
                -p $PORT:3000 \
                $IMAGE
              docker rm -f $TEMP_CONTAINER || true
            else
              echo "Health check FALLIDO. Cancelando despliegue y manteniendo version anterior."
              docker rm -f $TEMP_CONTAINER || true
              exit 1
            fi

            docker system prune -f

  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Desplegar en staging
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.DOCKER_USERNAME }}/inventario-api:staging"
            CONTAINER="${{ vars.CONTAINER_NAME }}"
            PORT="${{ vars.DEPLOY_PORT }}"
            TEMP_CONTAINER="${CONTAINER}-new"
            TEMP_PORT=$((PORT + 1))

            docker pull $IMAGE
            docker run -d \
              --name $TEMP_CONTAINER \
              --restart unless-stopped \
              -p $TEMP_PORT:3000 \
              $IMAGE

            sleep 5

            if curl -sf http://localhost:$TEMP_PORT/health; then
              echo "Health check exitoso. Activando nuevo contenedor..."
              docker stop $CONTAINER || true
              docker rm $CONTAINER || true
              docker run -d \
                --name $CONTAINER \
                --restart unless-stopped \
                -p $PORT:3000 \
                $IMAGE
              docker rm -f $TEMP_CONTAINER || true
            else
              echo "Health check FALLIDO. Cancelando despliegue y manteniendo version anterior."
              docker rm -f $TEMP_CONTAINER || true
              exit 1
            fi

            docker system prune -f
